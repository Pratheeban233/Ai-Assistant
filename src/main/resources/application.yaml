
spring:
  application:
    name: ai-assistant
  datasource:
    url: jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

langchain4j:
  google-ai-gemini:
    chat-model:
      api-key: ${GEMINI_API_KEY:}
      model-name: gemini-3.5-flash-lite #gemini-3.8-flash
      temperature: 0.2
      timeout: 90s
      max-retries: 0
      log-requests-and-responses: false

logging:
  level:
    dev.langchain4j: INFO
